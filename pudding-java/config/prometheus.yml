global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: pudding-java
    environment: production

scrape_configs:
  - job_name: pudding-java-app
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - pudding-java:8080
        labels:
          service: pudding-java

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
